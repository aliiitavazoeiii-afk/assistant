name: Biyok v2 CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server syntax
        run: |
          node --check server/server.mjs
          node --check server/lib/biyok.mjs
      - name: Import Biyok brain
        run: node -e "import('./server/lib/biyok.mjs').then(() => console.log('biyok brain ok'))"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish Biyok APK
        uses: actions/upload-artifact@v4
        with:
          name: biyok-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
