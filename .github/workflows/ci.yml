name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Persian offline speech model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/vosk-fa /tmp/vosk-fa /tmp/vosk-fa.zip
          mkdir -p app/src/main/assets /tmp/vosk-fa
          curl --fail --location --retry 4 --retry-delay 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip \
            --output /tmp/vosk-fa.zip
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa
          MODEL_DIR="$(find /tmp/vosk-fa -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$MODEL_DIR"
          cp -a "$MODEL_DIR" app/src/main/assets/vosk-fa
          printf '%s\n' 'biyok-vosk-fa-0.42' > app/src/main/assets/vosk-fa/uuid
          echo "Model size: $(du -sh app/src/main/assets/vosk-fa | cut -f1)"
          WORDS="$(find app/src/main/assets/vosk-fa -name words.txt | head -n1 || true)"
          if [ -n "$WORDS" ]; then
            echo "Wake vocabulary probes:"
            grep -E '^(بیوک|بویوک|بؤیوک|بیوگ|بیاک|بیاوک) ' "$WORDS" || true
          fi
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: biyok-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
